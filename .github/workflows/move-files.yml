name: Move LeetCode Solutions
on:
  push:
    paths-ignore:
      - '.github/**' # 무한 루프 방지

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Create directory and move files
        run: |
          mkdir -p LeetCode
          # README.md와 .github 폴더를 제외한 모든 파일을 이동 (필요에 따라 수정)
          find . -maxdepth 1 -not -name 'LeetCode' -not -name '.git' -not -name '.github' -not -name 'README.md' -exec mv {} LeetCode/ \;
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-move files to LeetCode folder" || echo "No changes to commit"
          git push
